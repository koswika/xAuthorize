name: XAuth
version: '1.0'
author: "elysium"

main: com.elysium.xAuth.XAuth
api-version: '1.21.11'
load: POSTWORLD
libraries:
  - org.mindrot:jbcrypt:0.4
commands:
  login:
    description: Login to your account
    usage: /login <password>
  register:
    description: Register your account
    usage: /register <password> <confirmPassword>
  xreset:
    description: Reset a players account
    usage: /xreset <player>

permissions:
  xauth.reset:
    description: Allows resetting a players account
    default: op
